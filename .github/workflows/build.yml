name: Build Chess Master Pro APK

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Setup Stockfish 18 Native Binaries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          
          # Download 64-bit ARM (arm64-v8a)
          curl -fSL -o /tmp/sf_arm64.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv8.tar
          tar -xf /tmp/sf_arm64.tar -C /tmp
          mv /tmp/stockfish/stockfish-android-armv8 app/src/main/jniLibs/arm64-v8a/libstockfish.so

          # Download 32-bit ARM (armeabi-v7a)
          curl -fSL -o /tmp/sf_arm32.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-android-armv7.tar
          tar -xf /tmp/sf_arm32.tar -C /tmp
          mv /tmp/stockfish/stockfish-android-armv7 app/src/main/jniLibs/armeabi-v7a/libstockfish.so

          # Download x86_64 (Emulators)
          curl -fSL -o /tmp/sf_x86_64.tar https://github.com/official-stockfish/Stockfish/releases/download/sf_18/stockfish-ubuntu-x86-64.tar
          tar -xf /tmp/sf_x86_64.tar -C /tmp
          mv /tmp/stockfish/stockfish-ubuntu-x86-64 app/src/main/jniLibs/x86_64/libstockfish.so

          chmod +x app/src/main/jniLibs/*/libstockfish.so
          ls -lh app/src/main/jniLibs/*

      - name: Decode Debug Keystore (if present)
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Android APK
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChessMasterPro-Stockfish18-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
